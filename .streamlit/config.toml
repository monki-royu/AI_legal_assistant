# ==================== Streamlit 正式部署配置 ====================
# 法智引擎 - AI法律助理 前端部署配置

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
enableStaticServing = true

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501

[theme]
# 浅色专业主题 - 清晰简约大气
base = "light"
primaryColor = "#1976D2"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#1F2937"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[runner]
magicEnabled = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(message)s"
