# compliance_review.yaml
# 合规审查数值校验规则（监管视角）
# 依据：《中央企业合规管理办法》第十三条、第十四条、第二十一条
#       GB/T 35770-2022/ISO 37301 第A.4.5条"合规义务"
# 立场：中立，对决策事项的合规性提出明确意见（通过/有条件通过/否决）,聚焦"监管红线、强制比例、禁止性规定
# 全局约束：本文件的违规结论为事实判定，合同审核（contract_review.yaml）不得降级或覆盖

version: "2.0"
metadata:
  owner: "法务部+合规部"
  last_updated: "2024-XX-XX"
  applicable_scope: "集团全部合同"
  legal_basis_doc: "《中央企业合规管理办法》+ GB/T 35770-2022"

# ==================== 维度一：招投标与政府采购合规 ====================
bidding_compliance:
  - rule_id: "CMP-BID-001"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'construction' AND amount >= 4000000"
    field: "construction_contract_amount"
    check_type: "process_required"
    required_process: "公开招标"
    severity: "critical"
    message: "施工单项合同估算价≥400万元，必须公开招标，合同若未走招标程序即违规"
    legal_basis: "《招标投标法》第三条 + 《招标投标法实施条例》"
    compliance_conclusion: "不通过"
    suggestion: "核验招标文件、中标通知书、评标报告是否齐全；未招标的须补正或重新招标"

  - rule_id: "CMP-BID-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'construction' AND amount >= 2000000"
    field: "equipment_material_amount"
    check_type: "process_required"
    required_process: "公开招标"
    severity: "critical"
    message: "重要设备材料采购单项合同估算价≥200万元，必须公开招标"
    legal_basis: "《招标投标法》及实施条例"
    compliance_conclusion: "不通过"

  - rule_id: "CMP-BID-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'construction' AND amount >= 1000000"
    field: "survey_design_supervision_amount"
    check_type: "process_required"
    required_process: "公开招标"
    severity: "critical"
    message: "勘察、设计、监理单项合同估算价≥100万元，必须公开招标"
    legal_basis: "《招标投标法》及实施条例"
    compliance_conclusion: "不通过"

  - rule_id: "CMP-BID-004"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "anti_split"
    check_type: "anti_split"
    severity: "critical"
    message: "禁止通过将项目拆分规避招标阈值"
    legal_basis: "《招标投标法》第四条（规避招标的禁止性规定）"
    compliance_conclusion: "不通过"

# ==================== 维度二：工程建设领域强制比例 ====================
construction_ratios:
  - rule_id: "CMP-CON-001"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'construction'"
    field: "performance_deposit_ratio"
    check_type: "threshold"
    operator: "<="
    threshold: 0.10
    severity: "critical"
    message: "履约保证金超过合同额10%，违反监管规定"
    legal_basis: "《招标投标法实施条例》第五十八条"
    compliance_conclusion: "不通过"
    suggestion: "将履约保证金调整至合同额10%以内"

  - rule_id: "CMP-CON-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'construction'"
    field: "quality_deposit_ratio"
    check_type: "threshold"
    operator: "<="
    threshold: 0.03
    severity: "critical"
    message: "工程质量保证金超过工程价款结算总额3%，违反监管规定"
    legal_basis: "《建设工程质量保证金管理办法》第七条"
    compliance_conclusion: "不通过"
    suggestion: "将质量保证金调整至结算总额3%以内"

  - rule_id: "CMP-CON-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'construction'"
    field: "deposit_mutual_exclusion"
    check_type: "mutual_exclusion"
    fields: ["performance_deposit_paid", "quality_deposit_reserved"]
    severity: "critical"
    message: "工程项目竣工前已缴履约保证金的，发包人不得同时预留工程质量保证金"
    legal_basis: "《建设工程质量保证金管理办法》第五条"
    compliance_conclusion: "不通过"

# ==================== 维度三：政府采购特殊规定 ====================
government_procurement_compliance:
  - rule_id: "CMP-GP-001"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'government_procurement'"
    field: "quality_deposit"
    check_type: "must_be_zero"
    severity: "critical"
    message: "政府采购货物和服务项目不得收取/预留质量保证金（禁止性规定）"
    legal_basis: "《政府采购法实施条例》及财政部相关规定"
    compliance_conclusion: "不通过"

  - rule_id: "CMP-GP-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'government_procurement'"
    field: "performance_deposit_ratio"
    check_type: "threshold"
    operator: "<="
    threshold: 0.10
    severity: "critical"
    message: "政府采购履约保证金不得超过合同金额10%"
    legal_basis: "《政府采购法实施条例》及相关规定"
    compliance_conclusion: "不通过"

  - rule_id: "CMP-GP-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    condition: "contract_type == 'government_procurement'"
    field: "procurement_method"
    check_type: "process_required"
    severity: "critical"
    message: "采购方式不符合《政府采购法》规定（应公开招标/邀请招标/竞争性谈判等）"
    legal_basis: "《政府采购法》第二十六条"
    compliance_conclusion: "不通过"

# ==================== 维度四：违约金合规红线 ====================
penalty_compliance:
  - rule_id: "CMP-PEN-001"
    rule_type: "hybrid"
    primary_reviewer: "both"
    field: "penalty_ratio"
    check_type: "threshold"
    operator: "<="
    threshold: 0.30
    severity: "high"
    message: "违约金超过实际损失30%，可能被认定为《民法典》第585条'过分高于造成的损失'，条款面临司法酌减风险"
    legal_basis: "《民法典》第585条 + 最高人民法院民法典工作会议纪要第十一条"
    compliance_conclusion: "有条件通过——建议修改后重新提交"
    suggestion: "将违约金调整为实际损失的30%以内，或与LPR挂钩"
    contract_ref: "商业保护力度分析见 contract_review.yaml CR-PEN-001"

  - rule_id: "CMP-PEN-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "daily_penalty_annualized"
    check_type: "annualized_threshold"
    operator: "<="
    annualized_threshold: 0.14
    severity: "high"
    message: "违约金折算年化利率远超民间借贷法定保护上限（LPR 4倍约13-14%），可能被认定为惩罚性过高"
    legal_basis: "《民法典》第585条 + 民间借贷司法解释（2020年修订）"
    compliance_conclusion: "不通过"

  - rule_id: "CMP-PEN-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "penalty_clause_fairness"
    check_type: "format_term_check"
    severity: "high"
    message: "违约金条款若存在免除己方责任、加重对方责任、排除对方主要权利情形，依《民法典》第497条可能无效"
    legal_basis: "《民法典》第497条（格式条款无效情形）"
    compliance_conclusion: "不通过"

# ==================== 维度五：数据合规数值阈值 ====================
data_compliance:
  - rule_id: "CMP-DATA-001"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "personal_info_subject_count"
    check_type: "threshold"
    operator: ">="
    threshold: 100000
    severity: "high"
    message: "处理个人信息达到规定数量，需指定个人信息保护负责人"
    legal_basis: "《个人信息保护法》第五十二条"
    compliance_conclusion: "不通过"
    suggestion: "指定个人信息保护负责人，并向监管部门报备"

  - rule_id: "CMP-DATA-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "cross_border_data_scale"
    check_type: "threshold"
    operator: ">="
    threshold: 1000000
    severity: "critical"
    message: "数据出境规模触达安全评估阈值，须通过国家网信部门安全评估"
    legal_basis: "《数据出境安全评估办法》第四条"
    compliance_conclusion: "不通过"
    suggestion: "申报数据出境安全评估，取得批准后方可出境"

  - rule_id: "CMP-DATA-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "risk_assessment_retention"
    check_type: "min_duration"
    operator: ">="
    min_years: 3
    severity: "high"
    message: "重要数据处理者风险评估记录留存不足3年"
    legal_basis: "《数据安全法》第三十条 + 相关实施条例"
    compliance_conclusion: "不通过"

# ==================== 维度六：财税合规数值 ====================
tax_compliance:
  - rule_id: "CMP-TAX-001"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "stamp_tax_category"
    check_type: "category_match"
    severity: "high"
    message: "合同性质与印花税税目不匹配，计税依据错误"
    legal_basis: "《印花税法》及《印花税税目税率表》"
    compliance_conclusion: "不通过"
    suggestion: "按合同实质性质匹配正确税目，核定计税依据"

  - rule_id: "CMP-TAX-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "related_party_pricing"
    check_type: "arm_length_test"
    severity: "high"
    message: "关联交易价格偏离独立交易原则，缺乏合理性说明"
    legal_basis: "《企业所得税法》第四十一条 + 特别纳税调整实施办法"
    compliance_conclusion: "不通过"
    suggestion: "提供转让定价报告或合理性说明"

  - rule_id: "CMP-TAX-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "capital_expenditure_threshold"
    check_type: "authorization_required"
    severity: "critical"
    message: "单笔资本性支出超过公司授权阈值，需董事会/股东会决议"
    legal_basis: "《公司法》相关条款 + 公司章程"
    compliance_conclusion: "不通过"
    suggestion: "提交董事会/股东会审议，取得有效决议后方可签署"

# ==================== 维度七：行业监管数值（按 contract_type 动态加载） ====================
industry_regulatory_red_lines:
  finance_lending:
    - rule_id: "CMP-IND-FIN-001"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      field: "interest_rate"
      check_type: "threshold"
      operator: "<="
      threshold: 0.14
      severity: "critical"
      message: "利率超过民间借贷法定保护上限（LPR 4倍约13-14%）"
      legal_basis: "民间借贷司法解释（2020年修订）第二十五条"
      compliance_conclusion: "不通过"

    - rule_id: "CMP-IND-FIN-002"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      field: "compound_interest"
      check_type: "prohibited"
      severity: "critical"
      message: "禁止复利滚存（利滚利）"
      legal_basis: "民间借贷司法解释（2020年修订）相关条款"
      compliance_conclusion: "不通过"

    - rule_id: "CMP-IND-FIN-003"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      condition: "fund_type == 'public_fund'"
      field: "public_fund_investment_ratio"
      check_type: "threshold"
      operator: "<="
      threshold: 0.10
      severity: "critical"
      message: "公募基金投资比例违反监管规则（如单只股票≤10%）"
      legal_basis: "《证券投资基金法》+ 证监会相关规定"
      compliance_conclusion: "不通过"

  medical_procurement:
    - rule_id: "CMP-IND-MED-001"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      field: "drug_markup_rate"
      check_type: "exact_value"
      operator: "=="
      threshold: 0
      severity: "critical"
      message: "药品加成违反零差率政策（加成率必须为0）"
      legal_basis: "国家卫健委药品零差率政策"
      compliance_conclusion: "不通过"

    - rule_id: "CMP-IND-MED-002"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      field: "medical_device_markup"
      check_type: "exact_value"
      operator: "=="
      threshold: 0
      severity: "critical"
      message: "医用耗材加成违反零差率政策"
      legal_basis: "国家卫健委耗材零差率政策"
      compliance_conclusion: "不通过"

    - rule_id: "CMP-IND-MED-003"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      field: "gsp_gmp_compliance"
      check_type: "certification_required"
      severity: "critical"
      message: "药品/医疗器械供应商未持有有效GSP/GMP认证"
      legal_basis: "《药品管理法》+《医疗器械监督管理条例》"
      compliance_conclusion: "不通过"

  government_procurement:
    - rule_id: "CMP-IND-GP-001"
      rule_type: "regulatory_red_line"
      primary_reviewer: "compliance"
      field: "service_warranty_period"
      check_type: "policy_compliance"
      severity: "high"
      message: "服务期/质保期不符合政府采购规定"
      legal_basis: "《政府采购法》及实施条例"
      compliance_conclusion: "不通过"

# ==================== 维度八：内部制度数值（依据《合规管理办法》第十三条） ====================
internal_policy:
  - rule_id: "CMP-INT-001"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "contract_amount"
    check_type: "budget_check"
    severity: "high"
    message: "合同金额超出年度预算额度"
    legal_basis: "《中央企业合规管理办法》第十三条（内部制度合规）"
    compliance_conclusion: "不通过"
    action: "需专项预算审批"

  - rule_id: "CMP-INT-002"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "signatory_authority"
    check_type: "authorization_check"
    severity: "critical"
    message: "合同金额超过签约人授权限额"
    legal_basis: "《中央企业合规管理办法》第十三条 + 企业授权管理制度"
    compliance_conclusion: "不通过"
    action: "需逐级审批至有权限层级"

  - rule_id: "CMP-INT-003"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "prepayment_ratio"
    check_type: "policy_threshold"
    operator: "<="
    threshold: 0.30
    severity: "medium"
    message: "预付款比例超过公司信用政策上限"
    legal_basis: "企业信用管理制度 + 《中央企业合规管理办法》第十三条"
    compliance_conclusion: "有条件通过"
    action: "需管理层特批"

  - rule_id: "CMP-INT-004"
    rule_type: "regulatory_red_line"
    primary_reviewer: "compliance"
    field: "state_owned_capital"
    condition: "enterprise_type == 'state_owned'"
    check_type: "policy_threshold"
    severity: "critical"
    message: "央企/国企预付款比例、保证金比例不符合国资监管要求"
    legal_basis: "国资监管相关规定 + 《中央企业合规管理办法》"
    compliance_conclusion: "不通过"
    action: "需国资监管部门审批"